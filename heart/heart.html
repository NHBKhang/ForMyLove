<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You</title>

    <link rel="stylesheet" href="heart.css">

    <link rel="icon" type="image/png" href="./../static/heart.png"> 
    
    <meta property="og:title" content="For You ❤️">
    <meta property="og:description" content="This heart beats for you.">
    <meta property="og:image" content="./../static/heart.png">
</head>

<body>
    <!-- Background -->
    <div class="background"></div>

    <!-- Ambient particles -->
    <div class="ambient-particles"></div>

    <!-- Main -->
    <main class="trend-heart-page">

        <!-- Canvas -->
        <canvas id="heartCanvas"></canvas>

        <!-- Heart glow -->
        <div class="heart-aura"></div>

        <!-- Center content -->
        <div class="heart-content">

            <p class="heart-label">
                MY HEART
            </p>

            <h1>
                Every beat<br>
                <span>is for you.</span>
            </h1>

            <p class="heart-description">
                Từng nhịp đập đều có tên em.
            </p>

        </div>

        <!-- Top text -->
        <div class="top-message">
            <span></span>
            A little piece of my heart
            <span></span>
        </div>

        <!-- Bottom -->
        <div class="heart-footer">
            MADE WITH LOVE · 05.07.2026
        </div>

    </main>

    <script src="heart.js"></script>

</body>

</html>
